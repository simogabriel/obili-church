  <path class="bible-page bible-page-right" d="M105 80c4-3 8-4 13-4v13c-5-.3-9 1.3-13 4z"/>
  <path class="bible-rule" d="M105 80v13m-10-13c3 .2 6 1.1 8 2.5m7-2.5c-2 .2-4 .8-6 1.7m-9 2.3c3 .2 6 1 8 2.2m7-2.2c-2 .2-4 .7-6 1.4"/>
  <path class="bible-cross" d="M105 67v8m-3-5h6"/>
